kind = "web"
previewPath = "/"
title = "For You"
version = "1.0.0"
id = "artifacts/romantic-experience"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19328

[services.development]
run = "pnpm --filter @workspace/romantic-experience run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/romantic-experience", "run", "build" ]
serve = "static"
publicDir = "artifacts/romantic-experience/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19328"
BASE_PATH = "/"
